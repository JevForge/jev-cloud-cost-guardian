name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Semver without the v prefix (example 0.1.1)
        required: true
      move_major_tag:
        description: Force-update the floating major tag (v0, v1, …)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate ref
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Run this workflow from the main branch only."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run all
      - name: Verify dist is committed
        run: |
          test -f dist/index.js
          if ! git diff --exit-code -- dist; then
            echo "dist/ is out of date. Run npm run build, commit dist, then retry."
            exit 1
          fi

      - name: Create and push version tag
        env:
          VERSION: ${{ inputs.version }}
          MOVE_MAJOR: ${{ inputs.move_major_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like X.Y.Z (got: $VERSION)"
            exit 1
          fi
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== version) {
            pkg.version = version;
            fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
            console.log(`package.json version → ${version}`);
          } else {
            console.log(`package.json already at ${version}`);
          }
          NODE

          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "chore: release ${TAG}"
            git push origin HEAD:main
          fi

          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

          {
            echo "Release ${TAG} of JEV Cloud Cost Guardian."
            echo
            echo "Pin consumers to \`@${TAG}\` or the floating major (for example \`@v0\`)."
            echo
            echo "Marketplace listing updates still require checking **Publish this Action to the GitHub Marketplace** in the browser (GitHub 2FA cannot run in CI)."
          } > /tmp/notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --generate-notes
          echo "Published GitHub Release ${TAG}"

          if [ "$MOVE_MAJOR" = "true" ]; then
            MAJOR="v$(echo "$VERSION" | cut -d. -f1)"
            git tag -f "$MAJOR" "$TAG"
            git push origin "refs/tags/${MAJOR}" --force
            echo "Updated floating tag $MAJOR → $TAG"
          fi

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run all
      - name: Verify dist is committed
        run: |
          test -f dist/index.js
          if ! git diff --exit-code -- dist; then
            echo "dist/ is out of date on this tag."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          {
            echo "Release ${TAG} of JEV Cloud Cost Guardian."
            echo
            echo "Pin consumers to \`@${TAG}\` or the floating major (for example \`@v0\`)."
            echo
            echo "Marketplace listing updates still require checking **Publish this Action to the GitHub Marketplace** in the browser (GitHub 2FA cannot run in CI)."
          } > /tmp/notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --generate-notes

      - name: Move floating major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MAJOR="v$(echo "${TAG#v}" | cut -d. -f1)"
          git tag -f "$MAJOR" "$TAG"
          git push origin "refs/tags/${MAJOR}" --force
          echo "Updated floating tag $MAJOR → $TAG"
