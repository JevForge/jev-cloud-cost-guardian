name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run all
      - run: git diff --exit-code -- dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Pin this action to the major tag or to the full commit SHA.
            The action does not apply infrastructure changes.
            Marketplace publication is a separate maintainer step.
