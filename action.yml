name: JEV Cloud Cost Guardian
description: Evaluate cloud spend against a budget and gate CI with Jev (approve, warn, block, or review).
author: JevForge
branding:
  icon: dollar-sign
  color: green

inputs:
  budget_monthly:
    description: Monthly budget in the budget currency. Required unless set in .jev/config.yml.
    required: false
  currency:
    description: ISO 4217 budget currency.
    required: false
    default: USD
  environment:
    description: Target environment (production, staging, development, sandbox, or other).
    required: false
    default: production
  budget_scope:
    description: Compare the budget to projected spend (baseline + delta) or to the delta only.
    required: false
    default: projected
  window_start:
    description: Inclusive cost window start (YYYY-MM-DD). Defaults to the first day of the current UTC month.
    required: false
  window_end:
    description: Exclusive cost window end (YYYY-MM-DD). Defaults to the first day of the next UTC month.
    required: false
  warn_utilization:
    description: Utilization ratio that marks evidence as approaching the budget (for example 0.8).
    required: false
    default: '0.8'
  block_utilization:
    description: Utilization ratio that can tighten approve/warn to block (for example 1.0).
    required: false
    default: '1'
  estimates_path:
    description: Workspace-relative path to normalized cost estimates (JSON or YAML).
    required: false
  estimates_json:
    description: Inline normalized estimates JSON. Do not combine with estimates_path.
    required: false
  infracost_path:
    description: Path to an Infracost breakdown JSON file.
    required: false
  terraform_plan_path:
    description: Path to terraform show -json output.
    required: false
  pricing_catalog_path:
    description: YAML catalog that prices Terraform resource changes.
    required: false
  kubernetes_paths:
    description: Comma or newline separated Kubernetes manifest files or directories.
    required: false
  k8s_unit_prices_path:
    description: YAML with cpu_per_month and memory_gib_per_month. Required when kubernetes_paths is set.
    required: false
  kubecost_path:
    description: Path to a Kubecost allocation JSON export.
    required: false
  aws_enabled:
    description: Read AWS Cost Explorer for the window. Uses the standard AWS credential chain.
    required: false
    default: 'false'
  include_aws_forecast:
    description: Add an informational AWS forecast line (not added into the budget total).
    required: false
    default: 'false'
  azure_enabled:
    description: Query Azure Cost Management. Requires AZURE_TENANT_ID, AZURE_CLIENT_ID, and AZURE_CLIENT_SECRET.
    required: false
    default: 'false'
  azure_subscription_id:
    description: Azure subscription id. Falls back to AZURE_SUBSCRIPTION_ID.
    required: false
  gcp_enabled:
    description: Query a BigQuery Cloud Billing export. Requires GCP_ACCESS_TOKEN or GOOGLE_APPLICATION_CREDENTIALS.
    required: false
    default: 'false'
  gcp_project_id:
    description: GCP project that runs the billing query.
    required: false
  gcp_billing_dataset:
    description: BigQuery dataset containing the billing export.
    required: false
  gcp_billing_table:
    description: BigQuery billing export table name.
    required: false
  gcp_location:
    description: BigQuery location for the billing query.
    required: false
    default: US
  normalize_to_monthly:
    description: Scale non-calendar-month billing windows to a 30.4375-day month. Calendar months are not scaled.
    required: false
    default: 'false'
  fx_rates:
    description: JSON map of source currency → budget-currency multiplier (example {"EUR":1.08}).
    required: false
  min_confidence:
    description: Minimum Jev confidence (0–1) required before an approve decision can stand.
    required: false
    default: '0.75'
  low_confidence_policy:
    description: Behavior when confidence is low or Jev is unavailable (fail, warn, request-review, no-op). Never becomes approve.
    required: false
    default: fail
  enforce_block_threshold:
    description: When true, utilization at or above block_utilization tightens approve and warn to block.
    required: false
    default: 'true'
  allow_unpriced:
    description: When false, unpriced lines prevent an approve decision.
    required: false
    default: 'false'
  allow_partial:
    description: When false, partial lines prevent an approve decision.
    required: false
    default: 'false'
  allow_missing_baseline:
    description: When false, projected scope cannot be approved without a known baseline.
    required: false
    default: 'false'
  fail_on_block:
    description: Fail the workflow when the final decision is block.
    required: false
    default: 'true'
  fail_on_manual_review:
    description: Fail the workflow when the final decision is manual-review.
    required: false
    default: 'false'
  redact_resource_names:
    description: Replace resource addresses with stable hashes before calling Jev and in outputs.
    required: false
    default: 'true'
  jev_provider:
    description: How to reach Jev (vercel-ai-gateway, typesafe-native, or custom-compatible). Not a cloud billing provider.
    required: false
    default: vercel-ai-gateway
  jev_endpoint:
    description: HTTPS evaluate endpoint. Required for typesafe-native and custom-compatible.
    required: false
  jev_model:
    description: Jev model id. Gateway default is typesafe-ai/jev. Required for typesafe-native and custom-compatible.
    required: false
  timeout_ms:
    description: Jev request timeout in milliseconds.
    required: false
    default: '45000'
  connector_timeout_ms:
    description: Cloud connector timeout in milliseconds.
    required: false
    default: '20000'
  comment_on_github:
    description: Post or update a pull request comment. Requires pull-requests: write.
    required: false
    default: 'false'
  dry_run:
    description: Evaluate and emit outputs, but skip the pull request comment.
    required: false
    default: 'false'
  github_token:
    description: Token used only when comment_on_github is true.
    required: false
    default: ${{ github.token }}

outputs:
  decision:
    description: Final gate decision (approve, warn, block, or manual-review).
  confidence:
    description: Confidence score between 0 and 1.
  reason_codes:
    description: JSON array of stable reason codes.
  estimated_monthly_impact:
    description: Proposed monthly cost delta.
  baseline_monthly:
    description: Known monthly baseline, or empty when unknown.
  projected_monthly:
    description: Baseline plus delta, or empty when the baseline is unknown.
  budget_monthly:
    description: Budget used for the decision.
  budget_remaining:
    description: Budget minus scoped cost. Negative means over budget.
  utilization:
    description: Scoped cost divided by budget, or empty when it cannot be computed.
  currency:
    description: Budget currency (ISO 4217).
  summary:
    description: One-line summary suitable for logs.
  explanation:
    description: Short human-readable explanation. Never executed as a command.
  provisional:
    description: true when Jev did not return a usable typed decision.
  findings:
    description: JSON array of every cost line. Lines are never dropped.
  sources:
    description: JSON array of cost source ids.
  unpriced_count:
    description: Number of lines with no monthly cost.

runs:
  using: node24
  main: dist/index.js
