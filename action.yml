name: JEV Cloud Cost Guardian
description: >
  Uses TypeSafe Jev to decide approve, warn, block, or manual-review for cloud cost
  changes against a budget. Keeps every cost line visible and does not apply infrastructure.
author: JevForge
branding:
  icon: dollar-sign
  color: green

inputs:
  budget_monthly:
    description: Monthly budget in the budget currency. Required when omitted from .jev/config.yml.
    required: false
  currency:
    description: ISO 4217 budget currency. Defaults to USD when omitted from the input and from .jev/config.yml.
    required: false
  environment:
    description: production, staging, development, sandbox, or other.
    required: false
  budget_scope:
    description: Compare the budget to projected (baseline + delta) or delta only.
    required: false
  window_start:
    description: Inclusive window start (YYYY-MM-DD). Defaults to the current UTC month.
    required: false
  window_end:
    description: Exclusive window end (YYYY-MM-DD). Defaults to the next UTC month.
    required: false
  warn_utilization:
    description: Utilization ratio at which the evidence is labeled as approaching the budget.
    required: false
  block_utilization:
    description: Utilization ratio at which approve and warn are tightened to block.
    required: false
  estimates_path:
    description: Workspace path to normalized cost estimates (JSON or YAML).
    required: false
  estimates_json:
    description: Inline normalized estimates JSON. Do not combine with estimates_path.
    required: false
  infracost_path:
    description: Path to an Infracost breakdown JSON file.
    required: false
  terraform_plan_path:
    description: Path to terraform show -json output.
    required: false
  pricing_catalog_path:
    description: YAML catalog that prices Terraform resource changes.
    required: false
  kubernetes_paths:
    description: Comma or newline separated manifest files or directories.
    required: false
  k8s_unit_prices_path:
    description: YAML file with cpu_per_month and memory_gib_per_month. Required with kubernetes_paths.
    required: false
  kubecost_path:
    description: Path to a Kubecost allocation JSON export.
    required: false
  aws_enabled:
    description: Read AWS Cost Explorer for the window. Requires standard AWS credentials.
    required: false
    default: 'false'
  include_aws_forecast:
    description: Add an informational AWS forecast line. It is not added to the budget total.
    required: false
    default: 'false'
  azure_enabled:
    description: Query Azure Cost Management. Requires AZURE_TENANT_ID, AZURE_CLIENT_ID, and AZURE_CLIENT_SECRET.
    required: false
    default: 'false'
  azure_subscription_id:
    description: Azure subscription id. Falls back to AZURE_SUBSCRIPTION_ID.
    required: false
  gcp_enabled:
    description: Query a BigQuery Cloud Billing export. Requires GCP_ACCESS_TOKEN or GOOGLE_APPLICATION_CREDENTIALS.
    required: false
    default: 'false'
  gcp_project_id:
    description: GCP project that runs the billing query.
    required: false
  gcp_billing_dataset:
    description: BigQuery dataset containing the billing export.
    required: false
  gcp_billing_table:
    description: BigQuery billing export table name.
    required: false
  gcp_location:
    description: BigQuery location for the billing query.
    required: false
    default: US
  normalize_to_monthly:
    description: Scale non-month billing windows to a 30.4375-day month. Calendar months are not scaled.
    required: false
    default: 'false'
  fx_rates:
    description: JSON map of source currency to budget-currency multiplier. Example {"EUR":1.08}.
    required: false
  min_confidence:
    description: Minimum Jev confidence required before an approve decision can stand.
    required: false
  low_confidence_policy:
    description: fail, warn, request-review, or no-op. Default fail. Never turns into approve.
    required: false
  enforce_block_threshold:
    description: When true, utilization at or above block_utilization tightens approve and warn to block.
    required: false
  allow_unpriced:
    description: When false, unpriced lines prevent an approve decision.
    required: false
  allow_partial:
    description: When false, partial lines prevent an approve decision.
    required: false
  allow_missing_baseline:
    description: When false, projected scope cannot be approved without a baseline.
    required: false
  fail_on_block:
    description: Fail the workflow when the final decision is block.
    required: false
  fail_on_manual_review:
    description: Fail the workflow when the final decision is manual-review.
    required: false
  redact_resource_names:
    description: Replace resource addresses with stable hashes before Jev and in outputs.
    required: false
  jev_provider:
    description: vercel-ai-gateway, typesafe-native, or custom-compatible. Default vercel-ai-gateway.
    required: false
  jev_endpoint:
    description: HTTPS evaluate endpoint. Required for typesafe-native and custom-compatible.
    required: false
  jev_model:
    description: Jev model id. Gateway default is typesafe-ai/jev. Required for the other providers.
    required: false
  timeout_ms:
    description: Jev request timeout in milliseconds.
    required: false
    default: '45000'
  connector_timeout_ms:
    description: Cloud connector timeout in milliseconds.
    required: false
    default: '20000'
  comment_on_github:
    description: Post or update a pull request comment. Requires pull-requests:write.
    required: false
  dry_run:
    description: Skip the pull request comment.
    required: false
    default: 'false'
  github_token:
    description: Token used only when comment_on_github is true.
    required: false
    default: ${{ github.token }}

outputs:
  decision:
    description: approve, warn, block, or manual-review.
  confidence:
    description: Confidence between 0 and 1.
  reason_codes:
    description: JSON array of stable reason codes.
  estimated_monthly_impact:
    description: Proposed monthly delta.
  baseline_monthly:
    description: Known monthly baseline, or empty when unknown.
  projected_monthly:
    description: Baseline plus delta, or empty when the baseline is unknown.
  budget_monthly:
    description: Budget used for the decision.
  budget_remaining:
    description: Budget minus scoped cost. Negative means over budget.
  utilization:
    description: Scoped cost divided by budget, or empty when it cannot be computed.
  currency:
    description: Budget currency.
  summary:
    description: One-line summary.
  explanation:
    description: Short explanation. It is never executed.
  provisional:
    description: true when Jev did not return a usable typed decision.
  findings:
    description: JSON array of every cost line. Lines are never dropped.
  sources:
    description: JSON array of source ids.
  unpriced_count:
    description: Number of lines with no monthly cost.

runs:
  using: node24
  main: dist/index.js
