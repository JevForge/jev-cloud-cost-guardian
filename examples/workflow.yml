name: Cloud cost gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Infracost breakdown
        run: infracost breakdown --path . --format json --out-file infracost.json
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - id: cost
        uses: JevForge/jev-cloud-cost-guardian@v0.1.0
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          budget_monthly: '1000'
          currency: USD
          environment: production
          infracost_path: infracost.json
          comment_on_github: 'true'
          github_token: ${{ github.token }}

      - name: Use decision
        run: |
          echo "decision=${{ steps.cost.outputs.decision }}"
          echo "projected=${{ steps.cost.outputs.projected_monthly }}"
          echo "remaining=${{ steps.cost.outputs.budget_remaining }}"
